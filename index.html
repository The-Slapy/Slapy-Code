    <script>
        var STATE_KEY_BASE = 'slapy_state_v34';
        var PREVIEW_STORAGE_PREFIX = 'slapy_preview_storage_v1';
        var PREVIEW_STORAGE_LIMITS = {
            key: 256,
            value: 1024 * 1024,
            total: 4 * 1024 * 1024
        };
        var activePreviewBridge = null;
        var previewStorageListenerInstalled = false;
        var previewRunSequence = 0;

        function getPreviewStorageKey(projectName) {
            var userScope = (currentUserCustom || 'guest').toLowerCase();
            return PREVIEW_STORAGE_PREFIX + '::' + encodeURIComponent(userScope) + '::' + encodeURIComponent(String(projectName));
        }

        function normalizePreviewSnapshot(value) {
            var clean = {};
            var total = 0;
            if(!value || typeof value !== 'object' || Array.isArray(value)) return clean;
            Object.keys(value).some(function(rawKey) {
                var key = String(rawKey);
                var item = String(value[rawKey]);
                var size = (key.length + item.length) * 2;
                if(key.length > PREVIEW_STORAGE_LIMITS.key || item.length > PREVIEW_STORAGE_LIMITS.value || total + size > PREVIEW_STORAGE_LIMITS.total) return false;
                clean[key] = item;
                total += size;
                return false;
            });
            return clean;
        }

        function loadPreviewSnapshot(storageKey) {
            if(typeof localforage !== 'undefined') {
                return localforage.getItem(storageKey).then(normalizePreviewSnapshot).catch(function() { return {}; });
            }
            try {
                return Promise.resolve(normalizePreviewSnapshot(safeParseJSON(localStorage.getItem(storageKey), {})));
            } catch(e) {
                return Promise.resolve({});
            }
        }

        function persistPreviewSnapshot(storageKey, snapshot) {
            var clean = normalizePreviewSnapshot(snapshot);
            if(typeof localforage !== 'undefined') return localforage.setItem(storageKey, clean);
            try {
                localStorage.setItem(storageKey, JSON.stringify(clean));
                return Promise.resolve();
            } catch(e) {
                return Promise.reject(e);
            }
        }

        function previewSnapshotSize(snapshot) {
            return Object.keys(snapshot).reduce(function(total, key) {
                return total + (key.length + String(snapshot[key]).length) * 2;
            }, 0);
        }

        function flushActivePreviewStorage() {
            if(!activePreviewBridge || !activePreviewBridge.dirty) return Promise.resolve();
            if(activePreviewBridge.persistTimer) {
                clearTimeout(activePreviewBridge.persistTimer);
                activePreviewBridge.persistTimer = null;
            }
            activePreviewBridge.dirty = false;
            return persistPreviewSnapshot(activePreviewBridge.storageKey, activePreviewBridge.snapshot).catch(function(err) {
                showToast('Preview: no se pudo persistir el almacenamiento virtual.');
                console.warn('Preview storage persistence failed:', err);
            });
        }

        function queuePreviewStoragePersist() {
            if(!activePreviewBridge) return;
            activePreviewBridge.dirty = true;
            if(activePreviewBridge.persistTimer) clearTimeout(activePreviewBridge.persistTimer);
            activePreviewBridge.persistTimer = setTimeout(function() {
                if(!activePreviewBridge) return;
                var bridge = activePreviewBridge;
                bridge.persistTimer = null;
                bridge.dirty = false;
                persistPreviewSnapshot(bridge.storageKey, bridge.snapshot).catch(function(err) {
                    showToast('Preview: no se pudo persistir el almacenamiento virtual.');
                    console.warn('Preview storage persistence failed:', err);
                });
            }, 120);
        }

        function handlePreviewMessage(event) {
            var bridge = activePreviewBridge;
            var data = event && event.data;
            if(!bridge || !data || typeof data !== 'object') return;
            if(event.source !== bridge.iframe.contentWindow || data.token !== bridge.token) return;

            if(data.type === 'SLAPY_PREVIEW_DIAGNOSTIC') {
                var message = String(data.message || 'Error desconocido').slice(0, 300);
                showToast('Preview: ' + message);
                return;
            }
            if(data.type !== 'SLAPY_PREVIEW_STORAGE') return;
            if(data.op !== 'set' && data.op !== 'remove' && data.op !== 'clear') return;

            var next = Object.assign({}, bridge.snapshot);
            if(data.op === 'clear') {
                next = {};
            } else {
                var key = String(data.key);
                if(key.length > PREVIEW_STORAGE_LIMITS.key) return;
                if(data.op === 'remove') {
                    delete next[key];
                } else {
                    var value = String(data.value);
                    if(value.length > PREVIEW_STORAGE_LIMITS.value) return;
                    next[key] = value;
                    if(previewSnapshotSize(next) > PREVIEW_STORAGE_LIMITS.total) return;
                }
            }
            bridge.snapshot = next;
            queuePreviewStoragePersist();
        }

        function ensurePreviewStorageListener() {
            if(previewStorageListenerInstalled) return;
            window.addEventListener('message', handlePreviewMessage, false);
            previewStorageListenerInstalled = true;
        }

        function createPreviewToken() {
            try {
                var bytes = new Uint32Array(4);
                crypto.getRandomValues(bytes);
                return Array.prototype.map.call(bytes, function(value) { return value.toString(36); }).join('-');
            } catch(e) {
                return Date.now().toString(36) + '-' + Math.random().toString(36).slice(2);
            }
        }

        function serializeForInlineScript(value) {
            return JSON.stringify(value)
                .replace(/</g, '\\u003c')
                .replace(/\u2028/g, '\\u2028')
                .replace(/\u2029/g, '\\u2029');
        }

        function previewStorageRuntime(snapshot, token, limits) {
            'use strict';
            function notify(type, payload) {
                var message = { type: type, token: token };
                Object.keys(payload || {}).forEach(function(key) { message[key] = payload[key]; });
                parent.postMessage(message, '*');
            }
            function quotaError() {
                try { return new DOMException('Preview storage quota exceeded', 'QuotaExceededError'); }
                catch(e) { var err = new Error('Preview storage quota exceeded'); err.name = 'QuotaExceededError'; return err; }
            }
            function sizeOf(data) {
                return Object.keys(data).reduce(function(total, key) {
                    return total + (key.length + data[key].length) * 2;
                }, 0);
            }
            function makeStorage(seed, persistent) {
                var data = Object.create(null);
                Object.keys(seed || {}).forEach(function(key) { data[String(key)] = String(seed[key]); });
                var storage = {
                    key: function(index) {
                        index = Math.trunc(Number(index) || 0);
                        return index >= 0 && index < Object.keys(data).length ? Object.keys(data)[index] : null;
                    },
                    getItem: function(key) {
                        key = String(key);
                        return Object.prototype.hasOwnProperty.call(data, key) ? data[key] : null;
                    },
                    setItem: function(key, value) {
                        key = String(key); value = String(value);
                        if(key.length > limits.key || value.length > limits.value) throw quotaError();
                        var next = Object.assign(Object.create(null), data); next[key] = value;
                        if(sizeOf(next) > limits.total) throw quotaError();
                        data = next;
                        if(persistent) notify('SLAPY_PREVIEW_STORAGE', { op: 'set', key: key, value: value });
                    },
                    removeItem: function(key) {
                        key = String(key);
                        if(!Object.prototype.hasOwnProperty.call(data, key)) return;
                        delete data[key];
                        if(persistent) notify('SLAPY_PREVIEW_STORAGE', { op: 'remove', key: key });
                    },
                    clear: function() {
                        data = Object.create(null);
                        if(persistent) notify('SLAPY_PREVIEW_STORAGE', { op: 'clear' });
                    }
                };
                Object.defineProperty(storage, 'length', {
                    configurable: false,
                    enumerable: true,
                    get: function() { return Object.keys(data).length; }
                });
                return storage;
            }
            function defineVirtual(name, value) {
                try {
                    Object.defineProperty(window, name, { configurable: false, enumerable: true, value: value });
                    return true;
                } catch(e) {
                    try {
                        Object.defineProperty(Window.prototype, name, { configurable: true, get: function() { return value; } });
                        return true;
                    } catch(ignore) { return false; }
                }
            }

            if(!defineVirtual('localStorage', makeStorage(snapshot, true)) ||
               !defineVirtual('sessionStorage', makeStorage({}, false))) {
                notify('SLAPY_PREVIEW_DIAGNOSTIC', { message: 'El navegador no permitió instalar Web Storage virtual.' });
            }
            ['indexedDB', 'webkitIndexedDB', 'mozIndexedDB', 'msIndexedDB', 'openDatabase'].forEach(function(name) {
                try { Object.defineProperty(window, name, { configurable: true, value: undefined }); } catch(e) {}
            });
            window.addEventListener('error', function(event) {
                notify('SLAPY_PREVIEW_DIAGNOSTIC', {
                    message: String(event.message || 'Error de ejecución').slice(0, 300),
                    source: String(event.filename || '').slice(0, 200),
                    line: Number(event.lineno || 0),
                    column: Number(event.colno || 0)
                });
            });
            window.addEventListener('unhandledrejection', function(event) {
                var reason = event.reason;
                notify('SLAPY_PREVIEW_DIAGNOSTIC', {
                    message: String(reason && reason.message ? reason.message : reason || 'Promesa rechazada').slice(0, 300)
                });
            });
        }

        function injectPreviewStorageBootstrap(html, snapshot, token) {
            var script = '<scr' + 'ipt>(' + previewStorageRuntime.toString() + ')(' +
                serializeForInlineScript(snapshot) + ',' +
                serializeForInlineScript(token) + ',' +
                serializeForInlineScript(PREVIEW_STORAGE_LIMITS) + ');</scr' + 'ipt>';
            if(/<head(?:\s[^>]*)?>/i.test(html)) {
                return html.replace(/<head(?:\s[^>]*)?>/i, function(match) { return match + script; });
            }
            if(/<html(?:\s[^>]*)?>/i.test(html)) {
                return html.replace(/<html(?:\s[^>]*)?>/i, function(match) { return match + '<head>' + script + '</head>'; });
            }
            return script + html;
        }

        function getStateStorageKey() {
            var owner = (currentUserCustom || 'guest').toLowerCase();
            return STATE_KEY_BASE + '::' + encodeURIComponent(owner);
        }

        function saveLocalState() { 
            if(typeof localforage !== 'undefined') {
                localforage.setItem(getStateStorageKey(), appState).catch(function(err) {
                    console.error("Error en IndexedDB:", err);
                });
            }
        }

        function escapeRegExp(string) {
            return String(string).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        }

        // Seguro para texto visible insertado mediante innerHTML.
        function escapeHtmlText(value) {
            return String(value == null ? '' : value)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }
        
        // Seguro para una cadena JS entre comillas dobles dentro de un atributo HTML entre comillas simples.
        function escapeAttr(value) {
            return String(value == null ? '' : value)
                .replace(/&/g, '&amp;')
                .replace(/\\/g, '\\\\')
                .replace(/"/g, '\\&quot;')
                .replace(/'/g, '&#39;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/\r/g, '\\r')
                .replace(/\n/g, '\\n');
        }

        function safeParseJSON(value, fallback) {
            try {
                return value ? JSON.parse(value) : fallback;
            } catch(e) {
                console.warn("Dato JSON local inválido; se usarán valores por defecto.", e);
                return fallback;
            }
        }

        function getVerifiedFirebaseUser() {
            try {
                if(typeof firebase === 'undefined' || !firebase.auth) return null;
                var user = firebase.auth().currentUser;
                if(!user || !user.email || !currentUserCustom) return null;
                return user.email.toLowerCase() === currentUserCustom.toLowerCase() ? user : null;
            } catch(e) {
                return null;
            }
        }

        function canUseCloud() {
            return !!(db && !isLocalSession && getVerifiedFirebaseUser());
        }

        function normalizeTheme(theme) {
            return theme === 'light' ? 'light' : 'dark';
        }

        function applyTheme(theme, options) {
            theme = normalizeTheme(theme);
            options = options || {};
            var isLight = theme === 'light';
            var root = document.documentElement;

            root.classList.toggle('light-mode', isLight);

            if(options.persist !== false) {
                try { localStorage.setItem('slapy_theme', theme); } catch(e) {}
            }

            var iconSun = document.getElementById('icon-sun');
            var iconMoon = document.getElementById('icon-moon');
            if(iconSun) iconSun.style.display = isLight ? 'none' : 'block';
            if(iconMoon) iconMoon.style.display = isLight ? 'block' : 'none';

            if(editor) editor.setOption('theme', isLight ? 'default' : 'monokai');

            var themeMeta = document.querySelector('meta[name="theme-color"]');
            if(themeMeta) themeMeta.setAttribute('content', isLight ? '#ffffff' : '#252526');

            return theme;
        }

        function initTheme() {
            return applyTheme(window.__slapyInitialTheme || 'dark', { persist: false });
        }

        function toggleTheme() {
            var root = document.documentElement;
            var nextTheme = root.classList.contains('light-mode') ? 'dark' : 'light';
            root.classList.add('theme-switching');
            applyTheme(nextTheme);
            void root.offsetHeight;
            root.classList.remove('theme-switching');
        }

        window.onerror = function(msg, url, line) {
            if (msg === "Script error." || line === 0) return false;
            console.error("Slapy Error (Línea " + line + "): " + msg);
            return false;
        };

        var db = null;
        try {
            if (typeof firebase !== 'undefined') {
                var firebaseConfig = {
                    apiKey: "AIzaSyDyyWwKKx1bgwObtFlZIgbPXUyQp3gKeKI",
                    authDomain: "visualcodepersonal.firebaseapp.com",
                    projectId: "visualcodepersonal",
                    storageBucket: "visualcodepersonal.firebasestorage.app"
                };
                if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
                db = firebase.firestore();
            }
        } catch(e) { console.warn("Firebase offline:", e); }
        
        var currentUserCustom = localStorage.getItem('slapy_logged_user') || localStorage.getItem('cs_logged_user') || ""; 
        var currentDisplayName = localStorage.getItem('slapy_display_name') || localStorage.getItem('cs_display_name') || currentUserCustom;
        var isLocalSession = localStorage.getItem('slapy_local_session') === '1'; 
        
        var isSyncing = false; 
        var isSplitMode = false;
        var globalCommits = {}; 
        var editorFontSize = 14;
        var debounceHistory;
        var hasSyncedCloud = false; // Guard de lecturas para Firestore
        var ghConfig = { repo: "The-Slapy/Slapy-Code", branch: "main", token: "" };

        // DICCIONARIO DE COMANDOS POR DEFECTO
        var defaultShortcuts = {
            runCode: { key: 's', ctrl: true, alt: false, shift: false, desc: 'Ejecutar Código' },
            toggleSearch: { key: 'f', ctrl: true, alt: false, shift: false, desc: 'Buscar y Reemplazar' },
            toggleFullscreen: { key: '0', ctrl: false, alt: true, shift: false, desc: 'Pantalla Completa' },
            layoutCode: { key: '1', ctrl: false, alt: true, shift: false, desc: 'Vista Solo Código' },

        };

        var customShortcuts = safeParseJSON(localStorage.getItem('slapy_shortcuts'), null) || JSON.parse(JSON.stringify(defaultShortcuts));
        var appState = { portafolios: {}, activePortafolio: null, activeFile: null };

        function showToast(msg) {
            var toast = document.getElementById('toast');
            if(toast) { toast.innerText = msg; toast.classList.add('show'); setTimeout(function() { toast.classList.remove('show'); }, 3000); }
        }

        function checkEmptyState() {
            var empty = document.getElementById('empty-workspace');
            if(empty) {
                if(!appState.activePortafolio || !appState.activeFile) empty.style.display = 'flex';
                else empty.style.display = 'none';
            }
        }

        var editor = null;
        initTheme();
        try {
            if (typeof CodeMirror !== 'undefined') {
                var txtArea = document.getElementById('main-editor');
                if(txtArea) {
                    var currentTheme = document.documentElement.classList.contains('light-mode') ? 'default' : 'monokai';
                    editor = CodeMirror.fromTextArea(txtArea, {
                        theme: currentTheme, lineNumbers: true, tabSize: 4, indentUnit: 4, lineWrapping: true, mode: 'htmlmixed'
                    });

                    editor.on('change', function(cm, changeObj) {
                        if(isSyncing || !appState.activePortafolio || !appState.activeFile) return;
                        
                        var currentPort = appState.portafolios[appState.activePortafolio];
                        if(currentPort && currentPort.files) {
                            currentPort.files[appState.activeFile] = editor.getValue();
                        }
                        
                        var pnl = document.getElementById('editor-search-panel');
                        if(pnl && pnl.classList.contains('active')) updateSearch(false);
                        
                        if (changeObj.origin !== 'setValue' && changeObj.origin !== 'undo' && changeObj.origin !== 'redo') {
                            clearTimeout(debounceHistory);
                            debounceHistory = setTimeout(function() {
                                var action = "Edición manual";
                                if (changeObj.origin === 'paste') action = "Texto pegado";
                                else if (changeObj.origin === '+delete') action = "Texto borrado";
                                else if (changeObj.origin === 'replace') action = "Palabra reemplazada";
                                pushLocalHistory(action);
                            }, 10000); // OPTIMIZADO PARA SAFARI/CHROME: 10s DEBOUNCE
                        }
                        saveLocalState();
                    });
                }
            }
        } catch(e) { console.error("Error al inicializar CodeMirror:", e); }

        var dmp = new diff_match_patch();

        function getFullCodeAt(historyArr, index) {
            if (!historyArr || historyArr.length === 0) return "";
            if (historyArr[index].code !== undefined && !historyArr[index].patch) return historyArr[index].code;
            
            var text = historyArr[0].code || "";
            for (var i = 1; i <= index; i++) {
                if (historyArr[i].code !== undefined && !historyArr[i].patch) {
                    text = historyArr[i].code;
                } else if(historyArr[i].patch) {
                    var patches = dmp.patch_fromText(historyArr[i].patch);
                    text = dmp.patch_apply(patches, text)[0];
                }
            }
            return text;
        }

        function pushLocalHistory(desc) {
            if(!appState.activePortafolio || !appState.activeFile || !editor) return;
            var currentPort = appState.portafolios[appState.activePortafolio];
            if(!currentPort) return;
            if (!currentPort.localHistory) currentPort.localHistory = {};
            if (!currentPort.localHistory[appState.activeFile]) currentPort.localHistory[appState.activeFile] = [];
            
            var arr = currentPort.localHistory[appState.activeFile];
            var currentCode = editor.getValue();
            
            if (arr.length === 0) {
                arr.push({ time: new Date().toLocaleTimeString(), desc: desc, code: currentCode, base: true });
                saveLocalState();
                return;
            }

            var lastCode = getFullCodeAt(arr, arr.length - 1);
            if (lastCode !== currentCode) {
                var diff = dmp.diff_main(lastCode, currentCode, true);
                if (diff.length > 2) dmp.diff_cleanupSemantic(diff);
                
                var patch_list = dmp.patch_make(lastCode, currentCode, diff);
                var patch_text = dmp.patch_toText(patch_list);

                if(patch_text.trim() === "") return;

                arr.push({ time: new Date().toLocaleTimeString(), desc: desc, patch: patch_text });
                
                if (arr.length > 50) {
                    var newBase = getFullCodeAt(arr, 1);
                    arr[1] = { time: arr[1].time, desc: arr[1].desc, code: newBase, base: true };
                    arr.shift();
                }
                saveLocalState();
                showToast("⏱️ Historial guardado: " + desc);
            }
        }

        function changeFontSize(dir) {
            editorFontSize += (dir * 2);
            if (editorFontSize < 8) editorFontSize = 8;
            if (editorFontSize > 36) editorFontSize = 36;
            var cmElements = document.getElementsByClassName('CodeMirror');
            for(var i=0; i<cmElements.length; i++) cmElements[i].style.fontSize = editorFontSize + 'px';
            if(editor) editor.refresh();
            localStorage.setItem('slapy_fontsize', editorFontSize);
        }
        if(localStorage.getItem('slapy_fontsize')) {
            editorFontSize = parseInt(localStorage.getItem('slapy_fontsize')); changeFontSize(0);
        }

        function handleFileUpload(event) {
            var pName = appState.activePortafolio;
            if(!pName) { showToast("Abre o crea un proyecto primero."); return; }
            var files = event.target.files;
            if(files.length === 0) return;
            
            var filesRead = 0;
            for(let i=0; i<files.length; i++) {

                    if(!appState.portafolios[pName].files) appState.portafolios[pName].files = {};
                    appState.portafolios[pName].files[f.name] = e.target.result;
                    filesRead++;
                    
                    if(filesRead === files.length) { 
                        appState.portafolios[pName].isOpen = true;
                        appState.portafolios[pName].isGhost = false;

                        renderExplorer();

                };
                if(f.type.startsWith('image/')) reader.readAsDataURL(f);

        function handleFolderUpload(event) {
            var files = event.target.files;
            if(files.length === 0) return;
            var folderName = files[0].webkitRelativePath.split('/')[0] || "Proyecto Importado";
            
            for(var p in appState.portafolios) { if(appState.portafolios[p]) appState.portafolios[p].isOpen = false; }
            if(!appState.portafolios[folderName]) appState.portafolios[folderName] = { isOpen: true, files: {}, openTabs: [], localHistory: {}, splitMap: {}, splitMeta: {}, openSubfolders: {} };
            else appState.portafolios[folderName].isOpen = true;
            
            var filesRead = 0;
            for(let i=0; i<files.length; i++) {
                let f = files[i];
                let relativePath = f.webkitRelativePath.split('/').slice(1).join('/'); // PRESERVA SUBCARPETAS
                if(!relativePath) relativePath = f.name;

                let reader = new FileReader();
                reader.onload = function(e) {
                    if(!appState.portafolios[folderName].files) appState.portafolios[folderName].files = {};
                    appState.portafolios[folderName].files[relativePath] = e.target.result;
                    filesRead++;
                    
                    if(filesRead === files.length) {
                        activatePortafolio(folderName);
                        saveLocalState(); 
                        renderExplorer(); 
                        showToast("✔ Carpeta Importada con subcarpetas: " + folderName);
                    }
                };
                if(f.type.startsWith('image/')) reader.readAsDataURL(f);
                else reader.readAsText(f);
            }
            event.target.value = '';
        }

        var dropZone = document.getElementById('drop-zone');

            wsArea.addEventListener('dragleave', function(e) { e.preventDefault(); e.stopPropagation(); dropZone.classList.remove('active'); });
            wsArea.addEventListener('drop', function(e) {
                e.preventDefault(); e.stopPropagation(); dropZone.classList.remove('active');
                var pName = appState.activePortafolio; if(!pName) return;
                if(e.dataTransfer.items) {
                    var items = e.dataTransfer.items;
                    var filesToRead = [];
                    for(var i=0; i<items.length; i++) {
                        if(items[i].kind === 'file') filesToRead.push(items[i].getAsFile());
                    }
                    var filesRead = 0;
                    if(filesToRead.length === 0) return;
                    
                    for(var i=0; i<filesToRead.length; i++) {
                        let file = filesToRead[i];
                        let reader = new FileReader();
                        reader.onload = (function(fName) {
                            return function(evt) {
                                if(!appState.portafolios[pName].files) appState.portafolios[pName].files = {};
                                appState.portafolios[pName].files[fName] = evt.target.result;
                                filesRead++;
                                
                                if(filesRead === filesToRead.length) {
                                    appState.portafolios[pName].isOpen = true;
                                    appState.portafolios[pName].isGhost = false;
                                    saveLocalState(); 
                                    renderExplorer(); 
                                    openFile(pName, fName);
                                    showToast("✔ Archivos agregados");
                                }
                            }
                        })(file.name);
                        if(file.type.startsWith('image/')) reader.readAsDataURL(file);
                        else reader.readAsText(file);

        function downloadSingleFile(pName, fName, e) {
            e.stopPropagation();
            var content = (appState.portafolios[pName].files && appState.portafolios[pName].files[fName]) || "";
            var link = document.createElement("a");
            if(content.startsWith('data:image/')) link.href = content;
            else link.href = URL.createObjectURL(new Blob([content], { type: "text/plain;charset=utf-8" }));
            link.download = fName; link.click(); showToast("Descargando archivo...");
        }

        function downloadPortafolio(pName, e) {
            e.stopPropagation();
            var zip = new JSZip();
            var files = appState.portafolios[pName].files || {};
            for(var f in files) {
                var content = files[f];
                if(content.startsWith('data:image/')) zip.file(f, content.split(',')[1], {base64: true});
                else zip.file(f, content);
            }
            zip.generateAsync({type:"blob"}).then(function(content) {
                var link = document.createElement("a"); link.href = URL.createObjectURL(content); link.download = pName + ".zip"; link.click(); showToast("Descargando proyecto .zip");
            });
        }

        function downloadAllPortafolios() {
            if(!appState.portafolios || Object.keys(appState.portafolios).length === 0) { showToast("No hay proyectos para descargar."); return; }
            var zip = new JSZip();
            for(var pName in appState.portafolios) {
                var folder = zip.folder(pName); var files = appState.portafolios[pName].files || {};
                for(var f in files) {
                    var content = files[f];
                    if(content.startsWith('data:image/')) folder.file(f, content.split(',')[1], {base64: true});
                    else folder.file(f, content);
                }
            }
            zip.generateAsync({type:"blob"}).then(function(content) {
                var link = document.createElement("a"); link.href = URL.createObjectURL(content); link.download = "Slapy_Backup.zip"; link.click(); showToast("Backup completo descargado");
            });

        // =========================================================

        // =========================================================
        function buildTreeFromFiles(filesObj) {
            var root = { _files: [], _folders: {} };
            for (var path in filesObj) {
                var parts = path.split('/');
                var current = root;
                for (var i = 0; i < parts.length - 1; i++) {
                    var folderName = parts[i];
                    if (!current._folders[folderName]) {
                        current._folders[folderName] = { _files: [], _folders: {} };
                    }
                    current = current._folders[folderName];
                }
                current._files.push({ fullPath: path, fileName: parts[parts.length - 1] });
            }
            return root;
        }

        function toggleSubfolder(pName, subPath, e) {

        function createSubfolder(pName, parentPrefix, e) {
            if(e) e.stopPropagation();
            if(!pName || !appState.portafolios[pName]) return;
            var msg = parentPrefix ? ("Nueva subcarpeta dentro de '" + parentPrefix + "':") : "Nombre de la nueva subcarpeta:";
            var folderName = prompt(msg);
            if(folderName && folderName.trim() !== "") {
                folderName = folderName.trim().replace(/\/+/g, '');
                var fullFolderPath = parentPrefix ? (parentPrefix + "/" + folderName) : folderName;
                var dummyFile = fullFolderPath + "/.gitkeep";
                if(!appState.portafolios[pName].files) appState.portafolios[pName].files = {};
                appState.portafolios[pName].files[dummyFile] = "";
                
                if(!appState.portafolios[pName].openSubfolders) appState.portafolios[pName].openSubfolders = {};
                var parts = fullFolderPath.split('/');
                var curr = "";
                for(var i=0; i<parts.length; i++) {
                    curr = curr ? (curr + "/" + parts[i]) : parts[i];
                    appState.portafolios[pName].openSubfolders[curr] = true;
                }
                
                saveLocalState();
                renderExplorer();
                showToast("📁 Subcarpeta '" + fullFolderPath + "' creada");
            }
        }

        function createFileInFolder(pName, folderPrefix, e) {
            if(e) e.stopPropagation();
            var pData = appState.portafolios[pName];
            if(!pData) return;
            var msg = folderPrefix ? ("Nuevo archivo dentro de '" + folderPrefix + "':") : "Nombre del archivo (ej. script.js o css/estilos.css):";
            var fName = prompt(msg);
            if(fName && fName.trim() !== "") {
                fName = fName.trim();
                if(folderPrefix) fName = folderPrefix + "/" + fName;
                if(!pData.files) pData.files = {};
                if(pData.files[fName] !== undefined) return;
                
                pData.files[fName] = "";
                
                if(!pData.openSubfolders) pData.openSubfolders = {};
                var parts = fName.split('/');
                var curr = "";
                for(var i=0; i<parts.length-1; i++) {
                    curr = curr ? (curr + "/" + parts[i]) : parts[i];
                    pData.openSubfolders[curr] = true;
                }
                
                pData.isOpen = true;
                pData.isGhost = false;
                openFile(pName, fName);
            }
        }

        function renameSubfolder(pName, subPath, e) {
            if(e) e.stopPropagation();
            var pData = appState.portafolios[pName];
            if(!pData || !pData.files || !subPath) return;

            var parts = subPath.split('/');
            var oldFolderName = parts.pop();
            var parentPrefix = parts.join('/');
            var newFolderName = prompt("Renombrar carpeta:", oldFolderName);
            if(!newFolderName || newFolderName.trim() === "") return;
            newFolderName = newFolderName.trim().replace(/\/+/g, '');
            if(!newFolderName || newFolderName === oldFolderName) return;

            var newPrefix = parentPrefix ? (parentPrefix + "/" + newFolderName) : newFolderName;
            var oldPrefix = subPath + "/";
            var newPrefixWithSlash = newPrefix + "/";
            var collision = Object.keys(pData.files).some(function(path) {
                return path === newPrefix || path.startsWith(newPrefixWithSlash);
            });
            if(collision) { showToast("⚠️ Ya existe una carpeta o elemento con ese nombre."); return; }

            function remapPath(path) {
                if(path === subPath) return newPrefix;
                if(path && path.startsWith(oldPrefix)) return newPrefixWithSlash + path.slice(oldPrefix.length);
                return path;
            }

            var pathMap = {};
            Object.keys(pData.files).forEach(function(path) {
                var mapped = remapPath(path);
                if(mapped !== path) pathMap[path] = mapped;
            });
            if(Object.keys(pathMap).length === 0) return;

            Object.keys(pathMap).forEach(function(oldPath) { pData.files[pathMap[oldPath]] = pData.files[oldPath]; });
            Object.keys(pathMap).forEach(function(oldPath) { delete pData.files[oldPath]; });

            function remapKeyedObject(obj) {
                if(!obj || typeof obj !== 'object') return;
                var changes = [];
                Object.keys(obj).forEach(function(key) {
                    var mapped = remapPath(key);
                    if(mapped !== key) changes.push([key, mapped, obj[key]]);
                });
                changes.forEach(function(item) { obj[item[1]] = item[2]; });
                changes.forEach(function(item) { delete obj[item[0]]; });
            }
            remapKeyedObject(pData.localHistory);
            remapKeyedObject(pData.splitMeta);

            if(pData.splitMap && typeof pData.splitMap === 'object') {
                var newSplitMap = {};
                Object.keys(pData.splitMap).forEach(function(parent) {
                    var children = pData.splitMap[parent];
                    newSplitMap[remapPath(parent)] = Array.isArray(children) ? children.map(remapPath) : children;
                });
                pData.splitMap = newSplitMap;
            }
            if(Array.isArray(pData.openTabs)) pData.openTabs = pData.openTabs.map(remapPath);
            if(appState.activePortafolio === pName && appState.activeFile) appState.activeFile = remapPath(appState.activeFile);

            if(pData.openSubfolders && typeof pData.openSubfolders === 'object') {
                var newOpenSubfolders = {};
                Object.keys(pData.openSubfolders).forEach(function(folder) { newOpenSubfolders[remapPath(folder)] = pData.openSubfolders[folder]; });
                pData.openSubfolders = newOpenSubfolders;
                pData.openSubfolders[newPrefix] = true;
            }

            Object.keys(pData.files).forEach(function(filePath) {
                if(typeof pData.files[filePath] !== 'string') return;
                Object.keys(pathMap).forEach(function(oldPath) {
                    var markerRegex = new RegExp("<!--\\s*\\[SLAPY-SPLIT:\\s*" + escapeRegExp(oldPath) + "\\s*\\]\\s*-->", "g");
                    pData.files[filePath] = pData.files[filePath].replace(markerRegex, "<!-- [SLAPY-SPLIT:" + pathMap[oldPath] + "] -->");
                });
            });

            saveLocalState(); renderExplorer(); renderTabs();
            if(appState.activePortafolio === pName && appState.activeFile && pData.files[appState.activeFile] !== undefined && editor) editor.setValue(pData.files[appState.activeFile]);
            showToast("✏️ Carpeta renombrada a: " + newPrefix);
        }

        function deleteSubfolder(pName, subPath, e) {
            if(e) e.stopPropagation();
            var pData = appState.portafolios[pName];
            if(!pData || !pData.files) return;
            if(confirm("¿Eliminar la subcarpeta '" + subPath + "' y todos sus archivos?")) {
                var prefix = subPath + "/";
                var deletedFiles = [];
                Object.keys(pData.files).forEach(function(fName) {
                    if(fName === subPath || fName.startsWith(prefix)) deletedFiles.push(fName);
                });

                deletedFiles.forEach(function(fName) {
                    if(pData.splitMap && Array.isArray(pData.splitMap[fName])) {
                        pData.splitMap[fName].slice().forEach(function(child) {
                            delete pData.files[child];
                            removeTab(pName, child);
                            if(pData.splitMeta) delete pData.splitMeta[child];
                            if(pData.localHistory) delete pData.localHistory[child];
                        });
                        delete pData.splitMap[fName];
                    }

                    if(pData.splitMap) {
                        Object.keys(pData.splitMap).forEach(function(parent) {
                            var children = pData.splitMap[parent];
                            if(!Array.isArray(children) || !children.includes(fName)) return;
                            pData.splitMap[parent] = children.filter(function(c) { return c !== fName; });
                            if(pData.files[parent] !== undefined) {
                                var markerRegex = new RegExp("<!--\\s*\\[SLAPY-SPLIT:\\s*" + escapeRegExp(fName) + "\\s*\\]\\s*-->", "g");
                                pData.files[parent] = pData.files[parent].replace(markerRegex, "");
                            }
                        });
                    }

                    delete pData.files[fName];
                    if(pData.localHistory) delete pData.localHistory[fName];
                    if(pData.splitMeta) delete pData.splitMeta[fName];
                    removeTab(pName, fName);
                    if(appState.activePortafolio === pName && appState.activeFile === fName) {
                        appState.activeFile = null;
                        if(editor) editor.setValue("");
                    }
                });

                if(pData.openSubfolders) {
                    Object.keys(pData.openSubfolders).forEach(function(folder) {
                        if(folder === subPath || folder.startsWith(prefix)) delete pData.openSubfolders[folder];
                    });

        function renamePortafolio(oldName, e) {
            e.stopPropagation();
            var newName = prompt("Renombrar proyecto:", oldName);
            if(!newName || newName.trim() === "" || newName === oldName || appState.portafolios[newName]) return;
            newName = newName.trim();

            appState.portafolios[newName] = appState.portafolios[oldName];
            delete appState.portafolios[oldName];
            if(appState.activePortafolio === oldName) appState.activePortafolio = newName;

            // Renombra también en Firestore conservando la subcolección de commits.
            if(canUseCloud()) {
                var oldDocRef = db.collection("proyectos").doc(oldName);
                var newDocRef = db.collection("proyectos").doc(newName);
                Promise.all([oldDocRef.get(), newDocRef.get()]).then(function(docs) {
                    var oldDoc = docs[0], newDoc = docs[1];
                    if(!oldDoc.exists || oldDoc.data().usuario !== currentUserCustom) return;
                    if(newDoc.exists && newDoc.data().usuario && newDoc.data().usuario !== currentUserCustom) {
                        throw new Error("El nuevo nombre ya está ocupado en la nube por otra cuenta.");
                    }
                    var data = oldDoc.data();
                    data.nombre = newName;
                    return oldDocRef.collection("commits").get().then(function(commitSnap) {
                        return newDocRef.set(data).then(function() {
                            return Promise.all(commitSnap.docs.map(function(commitDoc) {
                                return newDocRef.collection("commits").doc(commitDoc.id).set(commitDoc.data());
                            }));
                        }).then(function() {
                            return Promise.all(commitSnap.docs.map(function(commitDoc) { return commitDoc.ref.delete(); }));
                        }).then(function() {
                            return oldDocRef.delete();
                        });
                    });
                }).catch(function(err){
                    console.error("Error al renombrar en la nube:", err);
                    showToast("⚠️ Renombrado local; la nube no pudo renombrarse: " + err.message);
                });
            }

            saveLocalState(); renderExplorer();
            showToast("✔ Proyecto renombrado a: " + newName);
        }

        function renameFile(pName, oldName, e) {
            e.stopPropagation();
            var parts = oldName.split('/');
            var oldFileName = parts.pop();
            var folderPrefix = parts.join('/');

            var newFileName = prompt("Renombrar archivo:", oldFileName);
            if(!newFileName || newFileName.trim() === "" || newFileName === oldFileName) return;
            newFileName = newFileName.trim();

            var newName = folderPrefix ? (folderPrefix + "/" + newFileName) : newFileName;
            var pData = appState.portafolios[pName];
            if(!pData || (pData.files && pData.files[newName] !== undefined)) return;
            
            pData.files[newName] = pData.files[oldName];
            
            if(pData.localHistory && pData.localHistory[oldName]) {
                pData.localHistory[newName] = pData.localHistory[oldName];
                delete pData.localHistory[oldName];
            }
            if(pData.splitMap && pData.splitMap[oldName]) {
                pData.splitMap[newName] = pData.splitMap[oldName];
                delete pData.splitMap[oldName];
            }
            if(pData.splitMeta && pData.splitMeta[oldName]) {
                pData.splitMeta[newName] = pData.splitMeta[oldName];
                delete pData.splitMeta[oldName];
            }

            // Si el archivo renombrado es hijo de un HTML separado, actualiza la referencia y su marcador.
            if(pData.splitMap) {
                Object.keys(pData.splitMap).forEach(function(parent) {
                    var children = pData.splitMap[parent];
                    if(!Array.isArray(children)) return;
                    var childIndex = children.indexOf(oldName);
                    if(childIndex > -1) {
                        children[childIndex] = newName;
                        if(pData.files[parent] !== undefined) {
                            var markerRegex = new RegExp("<!--\\s*\\[SLAPY-SPLIT:\\s*" + escapeRegExp(oldName) + "\\s*\\]\\s*-->", "g");
                            pData.files[parent] = pData.files[parent].replace(markerRegex, function() {
                                return "<!-- [SLAPY-SPLIT:" + newName + "] -->";
                            });
                        }
                    }
                });
            }

            delete pData.files[oldName];
            
            var tabs = pData.openTabs || [];
            var idx = tabs.indexOf(oldName);
            if(idx > -1) tabs[idx] = newName;
            if(appState.activePortafolio === pName && appState.activeFile === oldName) appState.activeFile = newName;
            saveLocalState(); renderExplorer();
        }

        function deleteFile(pName, fName, e) {
            e.stopPropagation();
            var pData = appState.portafolios[pName];
            if(!pData || !pData.files) return;
            
            if(confirm("¿Eliminar " + fName + "?")) {
                if(pData.splitMap && Array.isArray(pData.splitMap[fName])) {
                    pData.splitMap[fName].forEach(function(c) {
                        delete pData.files[c]; removeTab(pName, c);
                        if(pData.splitMeta) delete pData.splitMeta[c];
                        if(pData.localHistory) delete pData.localHistory[c];
                    });
                    delete pData.splitMap[fName];
                }

                // Si era hijo de otro Split, elimina la referencia y el marcador del padre.
                if(pData.splitMap) {
                    Object.keys(pData.splitMap).forEach(function(parent) {
                        var children = pData.splitMap[parent];
                        if(!Array.isArray(children) || !children.includes(fName)) return;
                        pData.splitMap[parent] = children.filter(function(c) { return c !== fName; });
                        if(pData.files[parent] !== undefined) {
                            var markerRegex = new RegExp("<!--\\s*\\[SLAPY-SPLIT:\\s*" + escapeRegExp(fName) + "\\s*\\]\\s*-->", "g");
                            pData.files[parent] = pData.files[parent].replace(markerRegex, "");
                        }
                    });
                }

                delete pData.files[fName];
                if(pData.localHistory) delete pData.localHistory[fName];
                if(pData.splitMeta) delete pData.splitMeta[fName];
                removeTab(pName, fName);
                if(appState.activePortafolio === pName && appState.activeFile === fName) {
                    var tabs = pData.openTabs || [];
                    if(tabs.length > 0) openFile(pName, tabs[tabs.length - 1]);
                    else { appState.activeFile = null; if(editor) editor.setValue(""); checkEmptyState();}
                }
                saveLocalState(); renderExplorer();
            }
        }

        function deletePortafolio(pName, e) {
            e.stopPropagation();
            if(confirm("¿Eliminar proyecto '" + pName + "' localmente?")) {
                delete appState.portafolios[pName];
                if(appState.activePortafolio === pName) { appState.activePortafolio = null; appState.activeFile = null; if(editor) editor.setValue(""); checkEmptyState();}
                saveLocalState(); renderExplorer();
            }
        }

        function renderTabs() {
            var container = document.getElementById('tabs-container');
            if(!container) return;
            if(!appState.activePortafolio || !appState.portafolios[appState.activePortafolio]) { container.innerHTML = ""; return; }
            var pData = appState.portafolios[appState.activePortafolio];
            var html = "";
            
            var splitMap = pData.splitMap || {};
            var allSplitChildren = [];
            var allParents = [];
            Object.keys(splitMap).forEach(function(parent) {
                if(Array.isArray(splitMap[parent]) && splitMap[parent].length > 0) {
                    allParents.push(parent);
                    allSplitChildren = allSplitChildren.concat(splitMap[parent]);
                }
            });

            var tabs = pData.openTabs || [];
            tabs.forEach(function(fName) {
                if(pData.files && pData.files[fName] !== undefined) {
                    var isAct = (appState.activeFile === fName) ? "active" : "";
                    var typeClass = "";
                    if(allParents.includes(fName)) typeClass = isAct ? "tab-parent-active" : ""; 
                    else if(allSplitChildren.includes(fName)) typeClass = "tab-child-text"; 

                    var safePName = escapeAttr(appState.activePortafolio);
                    var safeFName = escapeAttr(fName);

                    html += "<div class='tab " + isAct + " " + typeClass + "' onclick='openFile(\"" + safePName + "\", \"" + safeFName + "\")'>";
                    html += "  <span>" + escapeHtmlText(fName) + "</span>";
                    html += "  <span class='tab-close' onclick='closeTab(\"" + safeFName + "\", event)'>×</span>";
                    html += "</div>";
                }
            });
            container.innerHTML = html;
        }

        function activatePortafolio(pName) {
            if(!appState.portafolios[pName]) return;
            appState.activePortafolio = pName;
            appState.portafolios[pName].isOpen = true;
            var pData = appState.portafolios[pName];
            if(!pData.openTabs) pData.openTabs = [];
            
            if(pData.openTabs.length === 0 && Object.keys(pData.files || {}).length > 0) {
                var firstFile = Object.keys(pData.files)[0];
                pData.openTabs.push(firstFile); 
                openFile(pName, firstFile);
            } else if (pData.openTabs.length > 0) {
                openFile(pName, pData.openTabs[pData.openTabs.length - 1]);
            } else { 
                appState.activeFile = null; 
                if(editor) editor.setValue(""); 
                renderExplorer(); 
                checkEmptyState();
            }
        }

        function openFile(pName, fName) {
            if(!pName || !fName) return; 
            var pData = appState.portafolios[pName];
            if(!pData) return;
            
            if(pData.isGhost) {
                return;
            }

            appState.activePortafolio = pName; appState.activeFile = fName;
            if(!pData.openTabs) pData.openTabs = [];
            if(!pData.openTabs.includes(fName)) pData.openTabs.push(fName);

            isSyncing = true;
            if(editor) {
                editor.setValue((pData.files && pData.files[fName]) || "");
                setTimeout(function() { editor.refresh(); }, 10);
            }
            
            if(!pData.localHistory) pData.localHistory = {};
            if(!pData.localHistory[fName] || !Array.isArray(pData.localHistory[fName]) || pData.localHistory[fName].length === 0) {
                pData.localHistory[fName] = [{ time: new Date().toLocaleTimeString(), desc: "Apertura de archivo", code: (pData.files && pData.files[fName]) || "" }];
            }

            if(editor) {
                var ext = fName.split('.').pop().toLowerCase();
                if(ext === 'js' || ext === 'json') editor.setOption("mode", "javascript");
                else if(ext === 'css') editor.setOption("mode", "css");
                else if(ext === 'html') editor.setOption("mode", "htmlmixed");
                else editor.setOption("mode", "text/plain");
            }
            
            isSyncing = false; 
            saveLocalState(); 
            renderExplorer(); 
            checkEmptyState();
            
            var splitMap = pData.splitMap || {};
            var btnSplit = document.getElementById('btn-split-toggle');
            if(btnSplit) {
                var isParentSplit = Array.isArray(splitMap[fName]) && splitMap[fName].length > 0;
                var isChildSplit = Object.keys(splitMap).some(function(k) { 
                    return Array.isArray(splitMap[k]) && splitMap[k].includes(fName); 
                });
                var fileContent = (pData.files && pData.files[fName]) || "";
                var hasSplitComments = /<!--\s*\[SLAPY-SPLIT:.*?\]\s*-->/i.test(fileContent);
                
                if(isParentSplit || isChildSplit || hasSplitComments) {
                    btnSplit.classList.add("active-tool"); btnSplit.innerText = "Un-Split";
                } else {
                    btnSplit.classList.remove("active-tool"); btnSplit.innerText = "Split";
                }
            }

            var searchPanel = document.getElementById('editor-search-panel');
            if(searchPanel && searchPanel.classList.contains('active')) updateSearch(true);
        }

        function removeTab(pName, fName) {
             if(!pName || !appState.portafolios[pName]) return;
             var tabs = appState.portafolios[pName].openTabs || [];
             var idx = tabs.indexOf(fName);
             if(idx > -1) tabs.splice(idx, 1);
        }

        function closeTab(fName, e) {
            e.stopPropagation();
            var pName = appState.activePortafolio;
            if(!pName || !appState.portafolios[pName]) return;
            var tabs = appState.portafolios[pName].openTabs || [];
            var idx = tabs.indexOf(fName);
            if(idx > -1) tabs.splice(idx, 1);
            
            if(appState.activeFile === fName) {
                if(tabs.length > 0) openFile(pName, tabs[tabs.length - 1]);
                else { appState.activeFile = null; if(editor) editor.setValue(""); renderExplorer(); checkEmptyState();}
            } else renderTabs();
            saveLocalState();
        }

        function createPortafolio() {
            var name = prompt("Nombre del Proyecto:");
            if(name && name.trim() !== "") {
                name = name.trim();
                if(appState.portafolios[name]) return;
                for(var p in appState.portafolios) { if(appState.portafolios[p]) appState.portafolios[p].isOpen = false; }
                var safeProjectName = escapeHtmlText(name);
                var safeCommentName = String(name).replace(/--/g, '—').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                appState.portafolios[name] = { 
                    isOpen: true, 
                    files: { "index.html": "<!--\n[SLAPY-VERSION: 1.0.0.0]\n[SLAPY-DESC: Creación del proyecto " + safeCommentName + "]\n-->\n<h1>Proyecto " + safeProjectName + "</h1>" }, 
                    openTabs: ["index.html"], localHistory: {}, splitMap: {}, splitMeta: {}, openSubfolders: {}
                };
                activatePortafolio(name);
            }
        }

        function getUniqueSplitFileName(pData, desiredName) {
            if(!pData.files || pData.files[desiredName] === undefined) return desiredName;
            var dot = desiredName.lastIndexOf('.');
            var base = dot > -1 ? desiredName.slice(0, dot) : desiredName;
            var ext = dot > -1 ? desiredName.slice(dot) : '';
            var n = 2;
            var candidate = base + "-" + n + ext;
            while(pData.files[candidate] !== undefined) {
                n++;
                candidate = base + "-" + n + ext;
            }
            return candidate;
        }

        function toggleSplitMode() {
            var pName = appState.activePortafolio;
            if(!pName || !appState.portafolios[pName]) return;
            
            if(editor && appState.activeFile) {
                appState.portafolios[pName].files[appState.activeFile] = editor.getValue();
            }

            var htmlFileName = appState.activeFile;
            var pData = appState.portafolios[pName];
            if(!pData.splitMap) pData.splitMap = {};
            if(!pData.splitMeta) pData.splitMeta = {};
            if(!pData.files) pData.files = {};
            if(!pData.openTabs) pData.openTabs = [];

            if(!htmlFileName || !htmlFileName.endsWith('.html')) {
                var foundParent = Object.keys(pData.splitMap).find(function(h) { 
                    return Array.isArray(pData.splitMap[h]) && pData.splitMap[h].includes(htmlFileName); 
                });
                if(foundParent) htmlFileName = foundParent;
                else {
                    for(var f in pData.files) { if(f.endsWith('.html')) { htmlFileName = f; break; } }
                }
            }
            if(!htmlFileName || pData.files[htmlFileName] === undefined) { showToast("Abre un archivo HTML"); return; }

            var splitChildren = pData.splitMap[htmlFileName] || [];
            var htmlCode = pData.files[htmlFileName] || "";

            if(!splitChildren || splitChildren.length === 0) {
                var commentMatches = htmlCode.match(/<!--\s*\[SLAPY-SPLIT:(.*?)\]\s*-->/gi);
                if(commentMatches && commentMatches.length > 0) {
                    splitChildren = [];
                    commentMatches.forEach(function(m) {
                        var match = m.match(/<!--\s*\[SLAPY-SPLIT:(.*?)\]\s*-->/i);
                        if(match && match[1] && pData.files[match[1].trim()] !== undefined) splitChildren.push(match[1].trim());
                    });
                    pData.splitMap[htmlFileName] = splitChildren;
                }
            }

            var btn = document.getElementById('btn-split-toggle');

            if(splitChildren.length === 0) { 
                var cssCount = 0, jsCount = 0, jsonCount = 0;
                var newChildren = [];
                var baseName = htmlFileName.replace(/\.html$/i, '');
                
                var styleTagRegex = /<style([^>]*)>([\s\S]*?)<\/style>/gi;
                htmlCode = htmlCode.replace(styleTagRegex, function(m, attrs, inner) {
                    var contenido = inner.trim(); if(contenido === "") return m; 
                    cssCount++;
                    var desired = baseName + "-style" + (cssCount===1?"":cssCount) + ".css";
                    var fName = getUniqueSplitFileName(pData, desired);
                    pData.files[fName] = contenido; newChildren.push(fName);
                    pData.splitMeta[fName] = { attrs: attrs || "" };
                    if(!pData.openTabs.includes(fName)) pData.openTabs.push(fName);
                    return "<!-- [SLAPY-SPLIT:" + fName + "] -->";
                });

                var scriptTagRegex = /<script([^>]*)>([\s\S]*?)<\/script>/gi;
                htmlCode = htmlCode.replace(scriptTagRegex, function(m, attrs, inner) {
                    if (attrs.toLowerCase().includes('src=')) return m;
                    var contenido = inner.trim(); if(contenido === "") return m;
                    
                    var desired = "";
                    if(attrs.toLowerCase().includes('application/json')) {
                        jsonCount++; var idMatch = attrs.match(/id=['"]([^'"]+)['"]/i);
                        desired = idMatch ? idMatch[1] + ".json" : baseName + "-data" + (jsonCount===1?"":jsonCount) + ".json";
                    } else {
                        jsCount++; 
                        desired = baseName + "-script" + (jsCount===1?"":jsCount) + ".js";
                    }
                    var fName = getUniqueSplitFileName(pData, desired);
                    pData.files[fName] = contenido; newChildren.push(fName);
                    pData.splitMeta[fName] = { attrs: attrs || "" };
                    if(!pData.openTabs.includes(fName)) pData.openTabs.push(fName);
                    return "<!-- [SLAPY-SPLIT:" + fName + "] -->";
                });

                if(newChildren.length > 0) {
                    pData.files[htmlFileName] = htmlCode;
                    pData.splitMap[htmlFileName] = newChildren;
                    if(btn) { btn.innerText = "Un-Split"; btn.classList.add("active-tool"); }
                    saveLocalState(); renderExplorer(); openFile(pName, htmlFileName);
                } else {
                    showToast("No hay CSS/JS interno para separar.");
                }

            } else { 
                splitChildren.slice().forEach(function(f) {
                    if(pData.files[f] === undefined) return;
                    var content = pData.files[f] || "";
                    var meta = pData.splitMeta && pData.splitMeta[f] ? pData.splitMeta[f] : { attrs: "" };
                    var attrs = meta.attrs || "";
                    var fullBlock = "";
                    
                    if(f.endsWith('.css')) {
                        fullBlock = '<style' + attrs + '>\n' + content + '\n</st' + 'yle>'; 
                    } else if(f.endsWith('.json')) {
                        if(!attrs.toLowerCase().includes('type=')) attrs = ' type="application/json"' + attrs;
                        if(!attrs.toLowerCase().includes('id=')) attrs += ' id="' + escapeHtmlText(f.split('.')[0]) + '"';
                        fullBlock = '<script' + attrs + '>\n' + content + '\n</scr' + 'ipt>';
                    } else if(f.endsWith('.js')) {
                        fullBlock = '<script' + attrs + '>\n' + content + '\n</scr' + 'ipt>'; 
                    }
                    
                    var markerRegex = new RegExp("<!--\\s*\\[SLAPY-SPLIT:\\s*" + escapeRegExp(f) + "\\s*\\]\\s*-->", "i");
                    
                    if(markerRegex.test(htmlCode)) {
                        htmlCode = htmlCode.replace(markerRegex, function() { return fullBlock; });
                    } else {
                        // Compatibilidad con proyectos separados por versiones anteriores, sin marcadores.
                        if(f.endsWith('.css')) {
                            if(/<\/head>/i.test(htmlCode)) htmlCode = htmlCode.replace(/<\/head>/i, function() { return fullBlock + '\n</head>'; });
                            else htmlCode = fullBlock + '\n' + htmlCode;
                        } else {
                            if(/<\/body>/i.test(htmlCode)) htmlCode = htmlCode.replace(/<\/body>/i, function() { return fullBlock + '\n</body>'; });
                            else htmlCode = htmlCode + '\n' + fullBlock;
                        }
                    }

                    delete pData.files[f]; removeTab(pName, f);
                    if(pData.splitMeta) delete pData.splitMeta[f];
                    if(pData.localHistory) delete pData.localHistory[f];
                });

                htmlCode = htmlCode.replace(/<!--\s*\[SLAPY-SPLIT:.*?\]\s*-->/gi, '');

                pData.files[htmlFileName] = htmlCode;
                pData.splitMap[htmlFileName] = [];
                
                if(btn) { btn.innerText = "Split"; btn.classList.remove("active-tool"); }
                saveLocalState(); renderExplorer(); openFile(pName, htmlFileName);
            }
        }

        async function runCode() {
            var pName = appState.activePortafolio;
            if(!pName || !appState.portafolios[pName]) {
                var keys = Object.keys(appState.portafolios || {});
                if(keys.length > 0) { activatePortafolio(keys[0]); pName = appState.activePortafolio; }
                else return;
            }
            
            var pData = appState.portafolios[pName];
            var htmlFileName = appState.activeFile;
            
            if(!htmlFileName || !htmlFileName.endsWith('.html')) {
                var foundParent = Object.keys(pData.splitMap || {}).find(function(h) { 
                    return Array.isArray(pData.splitMap[h]) && pData.splitMap[h].includes(htmlFileName); 
                });
                if(foundParent) htmlFileName = foundParent;
                else {
                    for(var f in (pData.files || {})) { if(f.endsWith('.html')) { htmlFileName = f; break; } }
                }
            }

            if(!htmlFileName || !pData.files || pData.files[htmlFileName] === undefined) {
                showToast("No hay archivo HTML abierto para ejecutar."); return;
            }

            var combined = pData.files[htmlFileName];
            var splitChildren = (pData.splitMap && pData.splitMap[htmlFileName]) || [];
            var cssCode = ""; var jsCode = "";

            splitChildren.forEach(function(fName) {
                if(pData.files[fName] === undefined) return;
                var content = pData.files[fName] || "";
                var meta = pData.splitMeta && pData.splitMeta[fName] ? pData.splitMeta[fName] : { attrs: "" };
                var attrs = meta.attrs || "";
                var fullBlock = "";

                if(fName.endsWith('.css')) {
                    fullBlock = '<style' + attrs + '>\n' + content + '\n</st' + 'yle>\n';
                } else if(fName.endsWith('.json')) {
                    if(!attrs.toLowerCase().includes('type=')) attrs = ' type="application/json"' + attrs;
                    if(!attrs.toLowerCase().includes('id=')) attrs += ' id="' + escapeHtmlText(fName.split('.')[0]) + '"';
                    fullBlock = '<script' + attrs + '>\n' + content + '\n</scr' + 'ipt>\n';
                } else if(fName.endsWith('.js')) {
                    fullBlock = '<script' + attrs + '>\n' + content + '\n</scr' + 'ipt>\n';
                }

                var markerRegex = new RegExp("<!--\\s*\\[SLAPY-SPLIT:\\s*" + escapeRegExp(fName) + "\\s*\\]\\s*-->", "i");
                if(markerRegex.test(combined)) {
                    combined = combined.replace(markerRegex, function() { return fullBlock; });
                } else if(fName.endsWith('.css')) {
                    cssCode += fullBlock;
                } else {
                    jsCode += fullBlock;
                }
            });

            // RESOLUCIÓN AUTOMÁTICA DE SUBCARPETAS Y ARCHIVOS VINCULADOS EN HTML
            Object.keys(pData.files || {}).forEach(function(relPath) {
                var content = pData.files[relPath] || "";
                var safePath = escapeRegExp(relPath);
                var altPath = escapeRegExp("./" + relPath);
                
                if(relPath.endsWith('.css')) {
                    var re1 = new RegExp("<link[^>]*href=[\"'](" + safePath + "|" + altPath + ")[\"'][^>]*>", "gi");
                    combined = combined.replace(re1, function() { return '<style>\n' + content + '\n</style>'; });
                } else if(relPath.endsWith('.js')) {
                    var re2 = new RegExp("<script[^>]*src=[\"'](" + safePath + "|" + altPath + ")[\"'][^>]*></scr" + "ipt>", "gi");
                    combined = combined.replace(re2, function() { return '<script>\n' + content + '\n</scr' + 'ipt>'; });
                } else if(content.startsWith('data:image/')) {
                    var re3 = new RegExp("src=[\"'](" + safePath + "|" + altPath + ")[\"']", "gi");
                    combined = combined.replace(re3, function() { return 'src="' + content + '"'; });
                }
            });

            if(cssCode) {
                if(/<\/head>/i.test(combined)) combined = combined.replace(/<\/head>/i, function() { return cssCode + '</head>'; });
                else combined = cssCode + combined;
            }
            if(jsCode) {
                if(/<\/body>/i.test(combined)) combined = combined.replace(/<\/body>/i, function() { return jsCode + '</body>'; });
                else combined = combined + '\n' + jsCode;
            }

            var runSequence = ++previewRunSequence;
            await flushActivePreviewStorage();
            var storageKey = getPreviewStorageKey(pName);
            var previewSnapshot = await loadPreviewSnapshot(storageKey);
            if(runSequence !== previewRunSequence) return;
            var previewToken = createPreviewToken();
            combined = injectPreviewStorageBootstrap(combined, previewSnapshot, previewToken);
            ensurePreviewStorageListener();
            
            var wrapper = document.getElementById('iframe-wrapper');
            if(wrapper) {
                activePreviewBridge = null;
                var oldIframe = wrapper.querySelector('iframe');
                if(oldIframe) {
                    try { oldIframe.src = 'about:blank'; } catch(e) {}
                }
                wrapper.innerHTML = ''; 
                
                var iframe = document.createElement('iframe');
                iframe.style.width = '100%';
                iframe.style.height = '100%';
                iframe.style.border = 'none';
                // El código del proyecto puede ejecutar scripts, pero queda en un origen opaco sin acceso al DOM/Storage de Slapy.
                iframe.setAttribute('sandbox', 'allow-scripts allow-forms allow-modals allow-downloads');
                wrapper.appendChild(iframe);
                activePreviewBridge = {
                    iframe: iframe,
                    token: previewToken,
                    storageKey: storageKey,
                    snapshot: previewSnapshot,
                    dirty: false,
                    persistTimer: null
                };
                iframe.srcdoc = combined;
            }
            saveLocalState();
            showToast("✔ Código Ejecutado");
        }

        document.addEventListener('keydown', function(e) {
            var activeTag = document.activeElement ? document.activeElement.tagName.toLowerCase() : '';
            var isTyping = (activeTag === 'input' || activeTag === 'textarea' || document.activeElement.closest('.CodeMirror'));

            function matchShortcut(sc, evt) {
                var pressedKey = evt.key.toLowerCase();
                var targetKey = sc.key.toLowerCase();
                var hasCtrl = evt.ctrlKey || evt.metaKey;
                return (pressedKey === targetKey || evt.code.toLowerCase() === 'digit' + targetKey) &&
                       (sc.ctrl === hasCtrl) &&
                       (sc.alt === evt.altKey) &&
                       (sc.shift === evt.shiftKey);
            }

            if (matchShortcut(customShortcuts.runCode, e)) { e.preventDefault(); runCode(); }
            if (matchShortcut(customShortcuts.toggleSearch, e)) { e.preventDefault(); toggleSearch(); }

            if (!isTyping) {
                if (matchShortcut(customShortcuts.toggleFullscreen, e)) { e.preventDefault(); toggleFullscreen(); }
                if (matchShortcut(customShortcuts.layoutCode, e)) { e.preventDefault(); setLayout('code'); }
                if (matchShortcut(customShortcuts.layoutSplit, e)) { e.preventDefault(); setLayout('split'); }
                if (matchShortcut(customShortcuts.layoutPreview, e)) { e.preventDefault(); setLayout('preview'); }
                if (matchShortcut(customShortcuts.toggleSidebarPin, e)) { e.preventDefault(); toggleSidebarPin(); }
                if (matchShortcut(customShortcuts.openCloudModal, e)) { e.preventDefault(); openCloudModal(); }
            }
        });

        function normalizeAppState(savedData) {
            appState = (savedData && typeof savedData === 'object') ? savedData : { portafolios: {}, activePortafolio: null, activeFile: null };
            if(!appState.portafolios || typeof appState.portafolios !== 'object') appState.portafolios = {};

            for(var p in appState.portafolios) {
                if(!appState.portafolios[p] || typeof appState.portafolios[p] !== 'object') appState.portafolios[p] = {};
                if(!appState.portafolios[p].files || typeof appState.portafolios[p].files !== 'object') appState.portafolios[p].files = {};
                if(!Array.isArray(appState.portafolios[p].openTabs)) appState.portafolios[p].openTabs = [];
                if(!appState.portafolios[p].splitMap || typeof appState.portafolios[p].splitMap !== 'object') appState.portafolios[p].splitMap = {};
                if(!appState.portafolios[p].splitMeta || typeof appState.portafolios[p].splitMeta !== 'object') appState.portafolios[p].splitMeta = {};
                if(!appState.portafolios[p].localHistory || typeof appState.portafolios[p].localHistory !== 'object') appState.portafolios[p].localHistory = {};
                if(!appState.portafolios[p].openSubfolders || typeof appState.portafolios[p].openSubfolders !== 'object') appState.portafolios[p].openSubfolders = {};
            }

            if(Object.keys(appState.portafolios).length === 0) {
                appState.portafolios["Mi Proyecto"] = {
                    isOpen: true,
                    files: { "index.html": "<!--\n[SLAPY-VERSION: 1.0.0.0]\n[SLAPY-DESC: Proyecto inicial]\n-->\n<h1 id='tit'>Hola Mundo</h1>\n<button id='btn'>Probar</button>\n<scr" + "ipt>\ndocument.getElementById('btn').onclick = function() {\n  alert('IndexedDB funcionando.');\n};\n</scr" + "ipt>" },
                    openTabs: ["index.html"], localHistory: {}, splitMap: {}, splitMeta: {}, openSubfolders: {}
                };
            }

            var pName = appState.activePortafolio;
            if(!pName || !appState.portafolios[pName]) pName = Object.keys(appState.portafolios)[0];
            if(pName && appState.portafolios[pName]) activatePortafolio(pName);
            else renderExplorer();
            checkEmptyState();
        }

        function loadLocalState() {
            if(typeof localforage === 'undefined') {
                normalizeAppState(null);
                return Promise.resolve();
            }

            var scopedKey = getStateStorageKey();
            return localforage.getItem(scopedKey).then(function(savedData) {
                if(savedData && typeof savedData === 'object') {
                    normalizeAppState(savedData);
                    return;
                }

                // Migra la antigua clave global una sola vez para no copiar datos de un usuario a otro.
                var migrationOwner = localStorage.getItem('slapy_state_v34_migrated_to');
                if(!migrationOwner) {
                    return localforage.getItem(STATE_KEY_BASE).then(function(legacyData) {
                        if(!legacyData) {
                            try { legacyData = safeParseJSON(localStorage.getItem(STATE_KEY_BASE), null); } catch(e) {}
                        }
                        if(legacyData && typeof legacyData === 'object') {
                            normalizeAppState(legacyData);
                            localStorage.setItem('slapy_state_v34_migrated_to', scopedKey);
                            return localforage.setItem(scopedKey, appState);
                        }
                        normalizeAppState(null);
                        return localforage.setItem(scopedKey, appState);
                    });
                }

                normalizeAppState(null);
                return localforage.setItem(scopedKey, appState);
            }).catch(function(err) {
                console.error("Error al arrancar IndexedDB:", err);
                normalizeAppState(null);
            });
        }

        function loginFirebase() {
            var email = document.getElementById('email-input').value.trim();
            var pass = document.getElementById('pass-input').value;
            var err = document.getElementById('auth-error');
            if(!email || !pass) { err.innerText = "Ingresa tu correo y contraseña."; return; }
            err.innerText = "Cargando...";

            if(typeof firebase !== 'undefined' && firebase.auth) {
                firebase.auth().signInWithEmailAndPassword(email, pass)
                .then(function(cred) {
                    var disp = cred.user.displayName || email.split('@')[0];
                    finishLogin(email, disp, false);
                })
                .catch(function(e) {
                    if(e.code === 'auth/network-request-failed') finishLogin(email, email.split('@')[0], true);
                    else err.innerText = "Error: Credenciales incorrectas.";
                });
            } else {
                finishLogin(email, email.split('@')[0], true);
            }
        }

        function registerFirebase() {
            var email = document.getElementById('email-input').value.trim();
            var pass = document.getElementById('pass-input').value;
            var err = document.getElementById('auth-error');
            if(!email || !pass) { err.innerText = "Ingresa un correo y contraseña."; return; }
            if(pass.length < 6) { err.innerText = "La contraseña debe tener mínimo 6 caracteres."; return; }
            err.innerText = "Creando...";
            
            if(typeof firebase !== 'undefined' && firebase.auth) {
                firebase.auth().createUserWithEmailAndPassword(email, pass)
                .then(function(cred) {
                    finishLogin(email, email.split('@')[0], false);
                })
                .catch(function(e) {
                    if(e.code === 'auth/network-request-failed') finishLogin(email, email.split('@')[0], true);
                    else if(e.code === 'auth/email-already-in-use') err.innerText = "Error: El correo ya está registrado.";
                    else if(e.code === 'auth/operation-not-allowed') err.innerText = "Error: Habilita Correo/Contraseña en Firebase Console.";
                    else err.innerText = "Error: " + e.message;
                });
            } else {
                finishLogin(email, email.split('@')[0], true);
            }
        }
