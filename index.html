        function loadCloudHistoryUI() {
            var pName = appState.activePortafolio;
            var container = document.getElementById('history-list-container');
            if(!container) return;
            container.textContent = "";

            var loading = document.createElement('div');
            loading.className = 'empty-text';
            loading.textContent = "Cargando historial de la nube...";
            container.appendChild(loading);

            if(!canUseCloud()) {
                loading.textContent = "Historial en Nube no disponible sin una sesión verificada.";
                return;
            }

            db.collection("proyectos").doc(pName).collection("commits").orderBy("timestamp", "desc").get().then(function(querySnapshot) {
                container.textContent = "";
                if (querySnapshot.empty) {
                    var empty = document.createElement('div'); empty.className = 'empty-text'; empty.textContent = 'Sin commits en la nube.'; container.appendChild(empty); return;
                }
                globalCommits = {}; 
                
                querySnapshot.forEach(function(doc) {
                    var data = doc.data(); var commitId = doc.id; globalCommits[commitId] = data.archivos_json; 
                    var d = new Date(data.timestamp); var m = d.getMinutes(); if(m < 10) m = "0" + m;
                    var dateStr = d.toLocaleDateString() + " " + d.getHours() + ":" + m;
                    
                    var snapshot = data.archivos_json || '';
                    var snapshotVersion = snapshot.match(/\[SLAPY-VERSION:\s*(.*?)(?:\]|\-\->)/i) || snapshot.match(/\[CS-VERSION:\s*(.*?)(?:\]|\-\->)/i);
                    var snapshotTitle = snapshot.match(/\[SLAPY-TITLE:\s*([\s\S]*?)(?:\]|\-\->)/i);
                    var snapshotDesc = snapshot.match(/\[SLAPY-DESC:\s*([\s\S]*?)(?:\]|\-\->)/i) || snapshot.match(/\[CS-DESC:\s*([\s\S]*?)(?:\]|\-\->)/i);
                    var version = data.version || (/^v?\d+(?:\.\d+)+$/i.test(data.titulo || '') ? data.titulo : '') || (snapshotVersion ? snapshotVersion[1].trim() : 'Sin versión');
                    var commitTitle = data.version ? (data.titulo || 'Sin título') : (snapshotTitle ? snapshotTitle[1].trim() : 'Sin título');
                    var commitDesc = data.descripcion || (snapshotDesc ? snapshotDesc[1].trim() : 'Sin descripción');

                    var card = document.createElement("div"); card.className = "commit-card";
                    var header = document.createElement('div'); header.className = 'commit-header';
                    var dateSpan = document.createElement('span'); dateSpan.textContent = dateStr;
                    var userSpan = document.createElement('span'); userSpan.textContent = data.usuario || '';
                    header.appendChild(dateSpan); header.appendChild(userSpan);
                    var summary = document.createElement('div'); summary.className = 'commit-summary';
                    var versionEl = document.createElement('span'); versionEl.className = 'commit-version'; versionEl.textContent = version;
                    var titleEl = document.createElement('div'); titleEl.className = 'commit-title'; titleEl.textContent = commitTitle;
                    var expandBtn = document.createElement('button'); expandBtn.className = 'btn commit-expand'; expandBtn.type = 'button'; expandBtn.textContent = '+'; expandBtn.setAttribute('aria-label', 'Mostrar descripción');
                    expandBtn.onclick = (function(targetCard, targetButton) { return function() { var expanded = targetCard.classList.toggle('expanded'); targetButton.textContent = expanded ? '−' : '+'; targetButton.setAttribute('aria-label', expanded ? 'Ocultar descripción' : 'Mostrar descripción'); }; })(card, expandBtn);
                    summary.appendChild(versionEl); summary.appendChild(titleEl); summary.appendChild(expandBtn);
                    var details = document.createElement('div'); details.className = 'commit-details';
                    var descEl = document.createElement('div'); descEl.className = 'commit-desc'; descEl.textContent = commitDesc;
                    details.appendChild(descEl);
                    card.appendChild(header); card.appendChild(summary); card.appendChild(details);

                    var btn = document.createElement("button"); btn.className = "btn-primary"; btn.innerText = "Restaurar Copia";
                    btn.onclick = (function(cId) { return function() { restoreCommitCloud(pName, cId); }; })(commitId);
                    details.appendChild(btn); container.appendChild(card);
                });
            }).catch(function(e) {
                container.textContent = "";
                var err = document.createElement('div'); err.className = 'empty-text'; err.textContent = 'Modo sin conexión.'; container.appendChild(err);
            });
        }

        function restoreCommitCloud(pName, commitId) {

                        filesToRestore = Object.assign({}, parsedData);

                    appState.portafolios[pName].files = filesToRestore;

                    appState.portafolios[pName].splitMeta = parsedData.splitMeta || {};
                    appState.portafolios[pName].isFavorite = parsedData.isFavorite || false;

        function captureShortcut(id, btnEl) {
            btnEl.innerText = "Presiona combinación...";
            btnEl.style.borderColor = "var(--accent)";

            function handler(e) {
                e.preventDefault();
                e.stopPropagation();

                var key = e.key.toLowerCase();
                if (["control", "shift", "alt", "meta"].includes(key)) return;

                customShortcuts[id].key = key;
                customShortcuts[id].ctrl = e.ctrlKey || e.metaKey;
                customShortcuts[id].alt = e.altKey;
                customShortcuts[id].shift = e.shiftKey;

                localStorage.setItem('slapy_shortcuts', JSON.stringify(customShortcuts));

                if(canUseCloud()) {
                    db.collection("usuarios").doc(currentUserCustom).set({ shortcuts: customShortcuts }, { merge: true });
                }

                window.removeEventListener('keydown', handler, true);
                renderShortcutsUI();
                showToast("✔ Comando actualizado: " + customShortcuts[id].desc);
            }

            window.addEventListener('keydown', handler, true);
        }

        function deployToGitHub() {
            var verifiedUser = getVerifiedFirebaseUser();
            if(!verifiedUser || verifiedUser.email.toLowerCase() !== "gab.rmz@icloud.com") {
                showToast("❌ Sesión de administrador no verificada.");
                return;
            }
            var repo = ghConfig.repo;
            var branch = ghConfig.branch;
            var token = ghConfig.token;
            var code = document.getElementById('update-code-input').value;

            if(!token) { showToast("❌ Error: No se encontró el Token en la nube."); return; }
            if(!code || !code.includes('SLAPY-VERSION')) { showToast("❌ Código inválido. Faltan etiquetas de versión."); return; }

            var vMatch = code.match(/\[SLAPY-VERSION:\s*(.*?)\]/i);
            var version = vMatch ? vMatch[1].trim() : "update";

            showToast("Conectando con GitHub... ⏳");
            var apiUrl = "https://api.github.com/repos/" + repo + "/contents/index.html?ref=" + branch;
            
            fetch(apiUrl, { headers: { "Authorization": "token " + token, "Accept": "application/vnd.github.v3+json" } })
            .then(res => {
                if(!res.ok && res.status !== 404) throw new Error("Error obteniendo info del repositorio.");
                return res.status === 404 ? { sha: null } : res.json();
            })
            .then(data => {
                var payload = { message: "Deploy Slapy v" + version, content: utf8_to_b64(code), branch: branch };
                if(data.sha) payload.sha = data.sha;

                return fetch("https://api.github.com/repos/" + repo + "/contents/index.html", {
                    method: "PUT", headers: { "Authorization": "token " + token, "Accept": "application/vnd.github.v3+json" },
                    body: JSON.stringify(payload)
                });
            })
            .then(res => {
                if(!res.ok) throw new Error("Fallo al subir a GitHub. Revisa tu Token.");
                return res.json();
            })
            .then(data => {
                showToast("✅ ¡Deploy exitoso! v" + version + " subida a GitHub Pages.");
                document.getElementById('update-code-input').value = "";
                closeInfoModal();
            })
            .catch(err => { showToast("❌ Error: " + err.message); console.error(err); });
        }

        var isBlockSearch = false;

        function toggleSearch() { 
            if(!editor) { showToast("Editor no inicializado"); return; }
            var panel = document.getElementById('editor-search-panel');
            var btnMain = document.getElementById('btn-search-main');
            if(panel && btnMain) {
                if(panel.classList.contains('active')) { 
                    panel.classList.remove('active'); btnMain.classList.remove('active-tool'); clearSearchState(); 
                } else { 
                    panel.classList.add('active'); btnMain.classList.add('active-tool'); document.getElementById('live-search-input').focus(); 
                }
            }
        }

        function toggleBlockSearch() {
            isBlockSearch = !isBlockSearch;
            var btn = document.getElementById('btn-block-search');
            var inputEnd = document.getElementById('live-search-end');
            if(isBlockSearch) {
                btn.classList.add('active-tool');
                inputEnd.style.display = 'block';
                inputEnd.focus();
            } else {
                btn.classList.remove('active-tool');
                inputEnd.style.display = 'none';
                inputEnd.value = '';
            }
            updateSearch(true);
        }

        function clearSearchState() {
            searchState.marks.forEach(function(m) { m.clear(); }); if(searchState.activeMark) searchState.activeMark.clear();
            searchState.marks = []; searchState.index = -1; searchState.activeMark = null;
            var cnt = document.getElementById('search-count');
            if(cnt) cnt.innerText = "0/0";
        }

        function updateSearch(jumpToFirst) {
            if(!editor) return;
            var qEl = document.getElementById('live-search-input');
            var qEndEl = document.getElementById('live-search-end');
            if(!qEl) return;
            
            var q = qEl.value;
            var qEnd = isBlockSearch ? qEndEl.value : "";
            
            clearSearchState(); 
            if(!q) return;

            if (isBlockSearch && qEnd) {
                var cursor = editor.getSearchCursor(q);
                while(cursor.findNext()) {
                    var startPos = cursor.from();
                    var endCursor = editor.getSearchCursor(qEnd, cursor.to());
                    if(endCursor.findNext()) {
                        var endPos = endCursor.to();
                        searchState.marks.push(editor.markText(startPos, endPos, {className: 'cm-matchhighlight'}));
                        cursor = editor.getSearchCursor(q, endPos);
                    }
                }
            } else {
                var cursor = editor.getSearchCursor(q);
                while(cursor.findNext()) {
                    searchState.marks.push(editor.markText(cursor.from(), cursor.to(), {className: 'cm-matchhighlight'}));
                }
            }

            var cnt = document.getElementById('search-count');
            if(searchState.marks.length > 0) { 
                if(jumpToFirst) goToMatch(0); 
                else if(cnt) cnt.innerText = "1 de " + searchState.marks.length; 
            }
        }

        function goToMatch(idx) {
            if(!editor || searchState.marks.length === 0) return;
            searchState.index = (idx + searchState.marks.length) % searchState.marks.length;
            var markObj = searchState.marks[searchState.index]; 
            var pos = markObj.find(); 
            if(!pos) return;
            
            if(searchState.activeMark) searchState.activeMark.clear();
            searchState.activeMark = editor.markText(pos.from, pos.to, {className: 'cm-match-active'});
            
            editor.setSelection(pos.from, pos.to);
            
            editor.scrollIntoView({from: pos.from, to: pos.to}, 100);
            var cnt = document.getElementById('search-count');
            if(cnt) cnt.innerText = (searchState.index + 1) + " de " + searchState.marks.length;
        }

        function nextMatch() { goToMatch(searchState.index + 1); }
        function prevMatch() { goToMatch(searchState.index - 1); }
        
        function doReplace() {
            if(!editor || searchState.marks.length === 0 || searchState.index === -1) return;
            var rep = document.getElementById('live-replace-input').value; 
            var pos = searchState.marks[searchState.index].find(); 
            if(!pos) return;
            editor.replaceRange(rep, pos.from, pos.to, 'replace'); 
            updateSearch(true); 
        }
        
        function doReplaceAll() {
            if(!editor || !appState.activePortafolio || !appState.activeFile) return;
            var q = document.getElementById('live-search-input').value; 
            var rep = document.getElementById('live-replace-input').value; 
            if(!q) return;

            isSyncing = true;
            try {
                if (!isBlockSearch) {
                    var content = editor.getValue();
                    editor.setValue(content.split(q).join(rep));
                } else {
                    for (var i = searchState.marks.length - 1; i >= 0; i--) {
                        var pos = searchState.marks[i].find();
                        if(pos) editor.replaceRange(rep, pos.from, pos.to, 'replace');
                    }
                }
            } finally {
                isSyncing = false;
            }

            var currentPort = appState.portafolios[appState.activePortafolio];
            if(currentPort && currentPort.files) {
                currentPort.files[appState.activeFile] = editor.getValue();
            }
            saveLocalState();
            pushLocalHistory(isBlockSearch ? "Reemplazo de Todo (Bloques)" : "Reemplazo de Todo");
            updateSearch(true);
        }
        
        var searchInput = document.getElementById('live-search-input');
        if(searchInput) {
            searchInput.addEventListener('keydown', function(e) {
                if(e.key === 'Enter') { e.preventDefault(); if(searchState.marks.length === 0) updateSearch(true); else nextMatch(); }
            });
        }
        var searchEndInput = document.getElementById('live-search-end');
        if(searchEndInput) {
            searchEndInput.addEventListener('keydown', function(e) {
                if(e.key === 'Enter') { e.preventDefault(); if(searchState.marks.length === 0) updateSearch(true); else nextMatch(); }
            });
        }
    </script>

    <!-- Registro PWA Seguro -->
    <script>
      if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('./sw.js')
            .then(function(reg) { console.log('Service Worker de Slapy registrado.'); })
            .catch(function(err) { console.log('Error PWA:', err); });
        });
      }
    </script>
</body>
